<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gmail Fetcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
  <button id="refreshBtn" class="refresh-btn">
  <span>Refresh</span>
  <svg class="refresh-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 30 30" fill="currentColor">
    <path d="M 15 3 C 12.053086 3 9.3294211 4.0897803 7.2558594 5.8359375 A 1.0001 1.0001 0 1 0 8.5449219 7.3652344 C 10.27136 5.9113916 12.546914 5 15 5 C 20.226608 5 24.456683 8.9136179 24.951172 14 L 22 14 L 26 20 L 30 14 L 26.949219 14 C 26.441216 7.8348596 21.297943 3 15 3 z M 4.3007812 9 L 0.30078125 15 L 3 15 C 3 21.635519 8.3644809 27 15 27 C 17.946914 27 20.670579 25.91022 22.744141 24.164062 A 1.0001 1.0001 0 1 0 21.455078 22.634766 C 19.72864 24.088608 17.453086 25 15 25 C 9.4355191 25 5 20.564481 5 15 L 8.3007812 15 L 4.3007812 9 z"></path>
  </svg>
</button>
  <h1 class="app-title">Gmail Fetcher</h1>

<div class="user-dropdown">
  <select id="userSelect" class="user-select">
  
  </select>
</div>
</header>

  <main class="container">
    <div class="card">
      

      <table class="email-table">
        <thead>
          <tr>
            <th class="col-no">S. No.</th>
            <th class="col-subject">Email</th>
            <th class="col-time">Time</th>
          </tr>
        </thead>
        <tbody id="emailTableBody">
          <tr>
            <td colspan="3" class="empty-row">Select an account to view emails</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <button id="modalClose" class="modal-close">X</button>
      <h2 id="modalSubject" class="modal-subject"></h2>
      <p id="modalDate" class="modal-date"></p>
      <div class="modal-meta">
        <p><strong>From:</strong> <span id="modalFrom"></span></p>
        <p><strong>Subject:</strong> <span id="modalSubjectLine"></span></p>
      </div>
      <hr />
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
